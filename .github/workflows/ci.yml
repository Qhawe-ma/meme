name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: checks
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mm_migrator
          POSTGRES_PASSWORD: mm_dev_only
          POSTGRES_DB: meme_market
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mm_migrator -d meme_market"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
        env:
          CI: "true"
          DATABASE_URL: postgres://app_rw:mm_app_dev_only@localhost:5432/meme_market
          MIGRATOR_DATABASE_URL: postgres://mm_migrator:mm_dev_only@localhost:5432/meme_market
          APP_URL: http://localhost:3000
          EMAIL_CAPTURE: "true"
          RATE_LIMIT_DISABLED: "1"
