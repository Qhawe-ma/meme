# Local dev services only. Passwords here are for your laptop, not for any real deployment.
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: mm_migrator
      POSTGRES_PASSWORD: mm_dev_only
      POSTGRES_DB: meme_market
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mm_migrator -d meme_market"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional local inbox. `docker compose --profile mail up -d`
  mailpit:
    image: axllent/mailpit:v1.21
    profiles: ["mail"]
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
