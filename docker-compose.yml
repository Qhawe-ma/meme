# Local Postgres for later migrations. This password is for your laptop only.
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: mm_migrator
      POSTGRES_PASSWORD: mm_dev_only
      POSTGRES_DB: meme_market
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mm_migrator -d meme_market"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
